format = """
[](#2E3440)\
$python\
$username\
[](bg:#3B4252 fg:#2E3440)\
$directory\
[](fg:#3B4252 bg:#434C5E)\
$git_branch\
$git_status\
[](fg:#434C5E bg:#A3BE8C)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
[](fg:#A3BE8C bg:#B48EAD)\
$docker_context\
[](fg:#B48EAD bg:#4C566A)\
$time\
[ ](fg:#4C566A)\
"""
command_timeout = 5000

[username]
show_always = true
style_user = "bg:#2E3440"
style_root = "bg:#2E3440"
format = '[$user ]($style)'

[directory]
style = "bg:#3B4252"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = ""
"Music" = ""
"Pictures" = ""

[c]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#A3BE8C"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#434C5E"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#434C5E"
format = '[$all_status$ahead_behind ]($style)'

[docker_context]
symbol = " "
style = "bg:#B48EAD"
format = '[ $symbol $context ]($style)$path'

[python]
style = "bg:#2E3440"
format = '[(\($virtualenv\) )]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#4C566A"
format = '[ $time ]($style)'
