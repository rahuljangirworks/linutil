name: Rahul Linutil Release

on:
  push:
    branches: ["dev"]
    tags:
      - "v*"
      - "latest"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type to create"
        required: true
        default: "pre-release"
        type: choice
        options:
          - "pre-release"
          - "latest"
      tag:
        description: "Stable release tag when release_type is latest, for example v2026.06.26"
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linutil_build:
    if: github.repository == 'rahuljangirworks/linutil'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install musl-tools
        
      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install cross-rs for cross-compilation
        run: cargo install cross

      - name: Build x86_64 binary
        run: cargo build --target-dir=build --release --verbose --target=x86_64-unknown-linux-musl --all-features

      - name: Build aarch64 binary
        run: |
          cross build --target-dir=build --release --verbose --target=aarch64-unknown-linux-musl --all-features
          mv ./build/aarch64-unknown-linux-musl/release/linutil ./build/aarch64-unknown-linux-musl/release/linutil-aarch64

      - name: Resolve release metadata
        id: release_meta
        env:
          DISPATCH_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          date_tag="$(date +"%Y.%m.%d")"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "dev" ]]; then
            tag="pre-${date_tag}-${GITHUB_RUN_NUMBER}"
            name="Rahul Linutil Pre-Release ${tag}"
            prerelease="true"
            make_latest="false"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            name="Rahul Linutil ${tag}"
            prerelease="false"
            make_latest="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_RELEASE_TYPE}" == "latest" ]]; then
            tag="${DISPATCH_TAG}"
            if [[ -z "${tag}" ]]; then
              echo "The tag input is required when release_type is latest." >&2
              exit 1
            fi
            name="Rahul Linutil ${tag}"
            prerelease="false"
            make_latest="true"
          else
            tag="pre-${date_tag}-${GITHUB_RUN_NUMBER}"
            name="Rahul Linutil Pre-Release ${tag}"
            prerelease="true"
            make_latest="false"
          fi

          {
            echo "tag=${tag}"
            echo "name=${name}"
            echo "prerelease=${prerelease}"
            echo "make_latest=${make_latest}"
          } >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: |
            Rahul personal Linutil build.

            Ref: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`

            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.release_meta.outputs.tag }}/linutil)
            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/${{ github.repository }}/${{ steps.release_meta.outputs.tag }}/linutil-aarch64)

          append_body: true
          generate_release_notes: true
          files: |
            ./build/x86_64-unknown-linux-musl/release/linutil
            ./build/aarch64-unknown-linux-musl/release/linutil-aarch64
            ./start.sh
            ./startdev.sh
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
