name: Label PRs by Type of Change

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  label-pr:
    if: github.repository == 'rahuljangirworks/linutil'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Check PR body and changed files
        uses: actions/github-script@v9
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const labelsToAdd = [];
            const labelDefinitions = {
              'new feature': { color: '0e8a16', description: 'New feature work' },
              bug: { color: 'd73a4a', description: 'Bug fix' },
              documentation: { color: '0075ca', description: 'Documentation change' },
              hotfix: { color: 'b60205', description: 'Urgent fix' },
              'UI update': { color: 'c5def5', description: 'UI or UX improvement' },
              rust: { color: 'dea584', description: 'Rust code change' },
              script: { color: 'fef2c0', description: 'Shell script change' },
            };

            if (/\[x\]\s*New feature/i.test(prBody)) {
              labelsToAdd.push('new feature');
            }
            if (/\[x\]\s*Bug fix/i.test(prBody)) {
              labelsToAdd.push('bug');
            }
            if (/\[x\]\s*Documentation update/i.test(prBody)) {
              labelsToAdd.push('documentation');
            }
            if (/\[x\]\s*Hotfix/i.test(prBody)) {
              labelsToAdd.push('hotfix');
            }
            if (/\[x\]\s*UI\/UX improvement/i.test(prBody)) {
              labelsToAdd.push('UI update');
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            if (files.some((file) => file.filename.endsWith('.rs'))) {
              labelsToAdd.push('rust');
            }
            if (files.some((file) => file.filename.endsWith('.sh'))) {
              labelsToAdd.push('script');
            }
            if (files.some((file) => file.filename.endsWith('.md'))) {
              labelsToAdd.push('documentation');
            }

            const issueRegex = /(?:Fixes|Resolves|Closes):?\s*#(\d+)/gi;
            const issueMatches = [...prBody.matchAll(issueRegex)];
            const issueNumbers = [...new Set(issueMatches.map((match) => parseInt(match[1], 10)))];

            for (const issueNumber of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                const issueLabels = issue.data.labels
                  .map((label) => typeof label === 'string' ? label : label.name)
                  .filter((name) => name.includes(':'));

                labelsToAdd.push(...issueLabels);
              } catch (error) {
                console.log(`Could not fetch issue #${issueNumber}: ${error.message}`);
              }
            }

            const uniqueLabels = [...new Set(labelsToAdd)];

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                const definition = labelDefinitions[name] || {
                  color: 'ededed',
                  description: 'Imported from referenced issue',
                };

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  ...definition,
                });
              }
            }

            for (const label of uniqueLabels) {
              await ensureLabel(label);
            }

            if (uniqueLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: uniqueLabels,
              });
            }
